<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>İçimizdeki Tamirci — Portalı</title>
    <meta
      name="description"
      content="İçimizdeki Tamirci — Rabia Alga ve Bedia Kahya Kılıç modern Link-in-Bio sayfaları ve seminer takvimi."
    />
    <link rel="stylesheet" href="css/modern.css" />
    <style>
      .portal-wrap {
        width: 100%;
        max-width: 640px;
        margin: 2.5rem auto;
        padding: 0 1.25rem;
      }
      .portal-card {
        background: #ffffff;
        border: 1px solid var(--border-light);
        border-radius: 28px;
        padding: 2.25rem 2rem;
        box-shadow: var(--shadow-card);
        text-align: center;
        margin-bottom: 1.5rem;
      }
      .portal-logo {
        width: 60px;
        height: 60px;
        border-radius: 18px;
        background: var(--primary);
        color: #ffffff;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-family: var(--font-display);
        font-size: 1.5rem;
        font-weight: 700;
        margin-bottom: 1.15rem;
        box-shadow: 0 8px 18px rgba(2, 163, 196, 0.3);
      }
      .portal-title {
        font-family: var(--font-display);
        font-size: 1.85rem;
        font-weight: 700;
        color: #0f172a;
        margin-bottom: 0.5rem;
      }
      .portal-desc {
        font-size: 0.95rem;
        color: var(--text-secondary);
        margin-bottom: 2rem;
        line-height: 1.6;
      }
      .profile-item-btn {
        display: flex;
        align-items: center;
        gap: 1.15rem;
        padding: 1.15rem 1.35rem;
        background: var(--bg-subtle);
        border: 1px solid var(--border-light);
        border-radius: 20px;
        margin-bottom: 1rem;
        transition: all 0.22s ease;
        text-align: left;
      }
      .profile-item-btn:hover {
        transform: translateY(-2px);
        border-color: var(--primary);
        box-shadow: var(--shadow-hover);
        background: #ffffff;
      }
      .profile-thumb {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        object-fit: cover;
        border: 2px solid var(--primary-soft);
        flex-shrink: 0;
      }
      .profile-item-name {
        font-size: 1.15rem;
        font-weight: 700;
        color: #0f172a;
        margin-bottom: 0.2rem;
      }
      .profile-item-role {
        font-size: 0.84rem;
        color: var(--text-muted);
      }
    </style>
  </head>
  <body>
    <main class="portal-wrap">
      <div class="portal-card">
        <div class="portal-logo">İT</div>
        <h1 class="portal-title">İçimizdeki Tamirci</h1>
        <p class="portal-desc">
          Bütünsel dönüşüm ve farkındalık eğitimleri seminer takvimi ve eğitmen profilleri
        </p>

        <a href="rabia-alga.html" class="profile-item-btn">
          <img src="assets/images/RabiaAlga.jpg" alt="Rabia Alga" class="profile-thumb" />
          <div style="flex:1;">
            <div class="profile-item-name">Rabia Alga</div>
            <div class="profile-item-role">Yüksek Mimar · ThetaHealing® & Silva Metodu Eğitmeni</div>
          </div>
          <span style="font-size:1.2rem; color:var(--primary);">↗</span>
        </a>

        <a href="bedia-kahya-kilic.html" class="profile-item-btn">
          <img src="assets/images/BediaKahyaKilic.jpg" alt="Bedia Kahya Kılıç" class="profile-thumb" />
          <div style="flex:1;">
            <div class="profile-item-name">Bedia Kahya Kılıç</div>
            <div class="profile-item-role">Endüstri Mühendisi (MBA) · ThetaHealing® Eğitmeni</div>
          </div>
          <span style="font-size:1.2rem; color:var(--primary);">↗</span>
        </a>

        <div style="margin-top:2rem; padding-top:1.5rem; border-top:1px solid var(--border-light);">
          <a href="admin.html" style="font-size:0.86rem; font-weight:600; color:var(--text-muted); display:inline-flex; align-items:center; gap:0.4rem;">
            <span>⚙️ Yönetici Girişi</span>
          </a>
        </div>
      </div>
    </main>
  </body>
</html>
